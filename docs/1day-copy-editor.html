const orig = DATA.map(d => ({zh: d.zh, en: d.en}));
const ask = new Set();
const body = document.getElementById('body');

DATA.forEach((d, i) => {
  const tr = document.createElement('tr');
  tr.dataset.i = i;
  const optsHTML = d.o.length
    ? `<div class="opts">` + d.o.map((t, j) =>
        `<button class="opt" data-i="${i}" data-j="${j}"><b>${[...t].length}字</b>${t.replace(/</g,'&lt;')}</button>`
      ).join('') + `</div>`
    : `<button class="ask" data-ask="${i}">让 Claude 重写这条</button>`;
  tr.innerHTML = `
    <td class="k">${d.k}${d.ph ? '<div class="ph">占位符</div>' : ''}</td>
    <td><textarea data-f="zh" data-i="${i}"></textarea>${optsHTML}</td>
    <td><textarea data-f="en" data-i="${i}"></textarea></td>
    <td class="g">${d.g}</td>
    <td class="note">${(d.note||'').replace(/</g,'&lt;')}</td>`;
  tr.querySelector('[data-f=zh]').value = d.zh;
  tr.querySelector('[data-f=en]').value = d.en;
  body.appendChild(tr);
});

function edits(){
  return DATA.map((d,i)=>({...d,i})).filter(d => d.zh!==orig[d.i].zh || d.en!==orig[d.i].en)
    .map(d => ({k:d.k, zh:d.zh, en:d.en}));
}
function mark(i){
  const tr = body.children[i];
  tr.classList.toggle('edited', DATA[i].zh!==orig[i].zh || DATA[i].en!==orig[i].en);
}
function refresh(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const g = document.getElementById('grp').value;
  const only = document.getElementById('only').value;
  let shown = 0;
  for (const tr of body.children){
    const i = tr.dataset.i, d = DATA[i];
    let ok = true;
    if (q) ok = (d.k+d.zh+d.en+d.note).toLowerCase().includes(q);
    if (ok && g) ok = d.g === g;
    if (ok && only==='ph') ok = d.ph;
    if (ok && only==='opt') ok = d.o.length > 0;
    if (ok && only==='ask') ok = ask.has(+i);
    if (ok && only==='edited') ok = d.zh!==orig[i].zh || d.en!==orig[i].en;
    tr.classList.toggle('hidden', !ok);
    if (ok) shown++;
  }
  window.__1dayCopyEdits = edits();
  window.__1dayCopyAsk = [...ask].map(i => DATA[i].k);
  document.getElementById('count').textContent =
    `显示 ${shown} · 改过 ${window.__1dayCopyEdits.length} · 待重写 ${ask.size}`;
}
body.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName !== 'TEXTAREA') return;
  DATA[t.dataset.i][t.dataset.f] = t.value;
  mark(t.dataset.i); refresh();
});
body.addEventListener('click', e => {
  const opt = e.target.closest('.opt');
  if (opt){
    const i = +opt.dataset.i, j = +opt.dataset.j;
    DATA[i].zh = DATA[i].o[j];
    body.children[i].querySelector('[data-f=zh]').value = DATA[i].zh;
    mark(i); refresh(); return;
  }
  const a = e.target.closest('.ask');
  if (a){
    const i = +a.dataset.ask;
    if (ask.has(i)) { ask.delete(i); a.classList.remove('on'); a.textContent = '让 Claude 重写这条'; }
    else { ask.add(i); a.classList.add('on'); a.textContent = '已标记，等 Claude 重写'; }
    refresh();
  }
});
['q','grp','only'].forEach(id => document.getElementById(id).addEventListener('input', refresh));
document.getElementById('save').addEventListener('click', () => {
  refresh();
  const b = document.getElementById('save');
  b.textContent = `改了 ${window.__1dayCopyEdits.length} 条，标了 ${ask.size} 条 —— 回去说一句`;
  b.classList.add('done');
});
refresh();
</script></body></html>

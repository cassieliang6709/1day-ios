    @media(max-width:820px){.shell{display:block}.sidebar{display:none}.main{padding-top:0}.topbar{height:auto;min-height:64px;padding:12px 18px;position:static}.topbar .meta{display:none}.mobile-nav{display:block;overflow:auto;white-space:nowrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}.mobile-nav button{border:0;background:transparent;padding:8px 9px;border-radius:7px;color:#596575;font-weight:650}.mobile-nav button.active{background:#fff0ed;color:#ba533f}.banner{margin:14px 18px 0}.storage-alert{margin:12px 18px 0}.content{padding:22px 18px 40px}.page-title{align-items:flex-start;flex-direction:column}.metrics,.two-col,.settings{grid-template-columns:1fr}.chart-wrap{height:210px}.funnel-row{grid-template-columns:105px 1fr 42px}.detail-grid{grid-template-columns:1fr}.search{min-width:0;width:100%}}

<body>
  <div class="shell">
    <aside class="sidebar" aria-label="主导航"><div class="brand"><span class="brand-mark">1</span>1day <small>Admin</small></div><nav class="nav" id="sideNav"></nav><div class="sidebar-foot"><strong>本地运营原型</strong>仅使用浏览器中的演示数据</div></aside>
    <main class="main"><header class="topbar"><h1>运营工作台</h1><div class="meta" id="refreshLabel">演示数据 · 最近刷新 —</div></header><nav class="mobile-nav" id="mobileNav" aria-label="移动导航"></nav><div class="banner">本地原型 · 演示数据 · 不影响线上 App</div><div class="storage-alert" id="storageAlert" role="alert"></div><div class="content">
      <section class="page active" id="overview"></section><section class="page" id="analysis"></section><section class="page" id="themes"></section><section class="page" id="config"></section><section class="page" id="monitor"></section><section class="page" id="releases"></section>
    </div></main>
  </div>
  <dialog id="themeDialog" aria-labelledby="themeDialogTitle"><form id="themeForm"><div class="dialog-head"><h3 id="themeDialogTitle">新建主题</h3><button class="icon-btn" id="closeTheme" type="button" aria-label="关闭">×</button></div><div class="dialog-body"><div class="form-error" id="themeError" role="alert"></div><div class="form-grid"><div class="field"><label for="themeZh">中文标题</label><input id="themeZh" required maxlength="40" placeholder="例如：慢慢过周末" /></div><div class="field"><label for="themeEn">English title</label><input id="themeEn" required maxlength="40" placeholder="e.g. A slow weekend" /></div><div class="field"><label for="themeType">类型</label><select id="themeType"><option value="one_day">一天故事</option><option value="seven_day">七天故事</option></select></div><div class="field"><label for="themePromptsZh">拍摄提示（中文）</label><textarea id="themePromptsZh" required placeholder="每行一条中文提示"></textarea></div><div class="field"><label for="themePromptsEn">Prompts (English)</label><textarea id="themePromptsEn" required placeholder="One English prompt per matching line"></textarea><small>一天主题 1–12 条；七天主题必须恰好 7 条。双语提示逐行对应。</small></div><label class="switch-line"><span><strong>主题可用</strong><p>关闭后不会出现在可推荐主题中。</p></span><span class="switch"><input id="themeAvailable" type="checkbox" checked /><span class="slider"></span></span></label></div></div><div class="dialog-foot"><button class="button" id="cancelTheme" type="button">取消</button><button class="button primary" id="saveThemeButton" type="submit">保存草稿</button></div></form></dialog>
  <dialog id="previewDialog" aria-labelledby="previewTitle"><div class="dialog-head"><h3 id="previewTitle">主题预览</h3><button class="icon-btn" onclick="document.getElementById('previewDialog').close()" aria-label="关闭">×</button></div><div class="dialog-body" id="previewContent"></div><div class="dialog-foot"><button class="button" onclick="document.getElementById('previewDialog').close()">关闭</button></div></dialog>
  <dialog id="snapshotDialog" aria-labelledby="snapshotTitle"><div class="dialog-head"><h3 id="snapshotTitle">发布快照</h3><button class="icon-btn" onclick="document.getElementById('snapshotDialog').close()" aria-label="关闭">×</button></div><div class="dialog-body"><p class="filter-note">不可变 JSON 副本，展示本地保存时的主题与配置。</p><pre class="snapshot" id="snapshotContent"></pre></div><div class="dialog-foot"><button class="button" onclick="document.getElementById('snapshotDialog').close()">关闭</button></div></dialog>
  <dialog id="issueDialog" aria-labelledby="issueTitle"><div class="dialog-head"><h3 id="issueTitle">演示问题详情</h3><button class="icon-btn" onclick="document.getElementById('issueDialog').close()" aria-label="关闭">×</button></div><div class="dialog-body" id="issueContent"></div><div class="dialog-foot"><button class="button" onclick="document.getElementById('issueDialog').close()">关闭</button></div></dialog>
  <dialog id="publishDialog" aria-labelledby="publishTitle"><div class="dialog-head"><h3 id="publishTitle">发布前检查</h3><button class="icon-btn" id="cancelPublishTop" type="button" aria-label="关闭">×</button></div><div class="dialog-body" id="publishReview"></div><div class="dialog-foot"><button class="button" id="cancelPublish" type="button">取消</button><button class="button primary" id="confirmPublish" type="button">确认变更并发布</button></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    'use strict';
    const STORAGE='one-day-admin-prototype-v1'; const TODAY=new Date('2026-09-22T12:00:00');
    const nav=[['overview','总览'],['analysis','创作分析'],['themes','主题管理'],['config','运营配置'],['monitor','运行监控'],['releases','发布记录']];
    const p=(zh,en)=>({id:'prompt-'+Math.random().toString(36).slice(2),zh,en});
    const initialThemes=[
      {id:'slow-weekend',zh:'慢慢过周末',en:'A slow weekend',type:'one_day',available:true,prompts:[p('把闹钟关掉以后，窗外是什么样？','What does the window look like after the alarm?'),p('给自己留一段慢下来的时间','Make room for a slower moment.'),p('把今天最松弛的一个瞬间留下来','Keep the loosest moment of today.')]},
      {id:'city-walk',zh:'城市散步',en:'City walk',type:'one_day',available:true,prompts:[p('从哪一条街开始走？','Which street will you start on?'),p('一处你平时会忽略的细节','A detail you usually overlook.'),p('走到累时，抬头看见了什么？','What do you see when you look up?')]},
      {id:'friends-day',zh:'和朋友的一天',en:'A day with friends',type:'one_day',available:true,prompts:[p('见面前的期待','The anticipation before meeting.'),p('一起做的一件小事','One small thing you do together.'),p('想留给彼此的一句话','A sentence to keep for each other.')]},
      {id:'little-joys',zh:'七天的小确幸',en:'Seven little joys',type:'seven_day',available:true,prompts:[p('第一天的小光','A little light on day one.'),p('今天让你笑起来的小事','A small thing that made you smile.'),p('留下一段安静的光','Keep a quiet patch of light.'),p('一件正在慢慢变好的事','Something slowly getting better.'),p('和谁分享了片刻','Who shared a moment with you?'),p('今天想感谢什么','What are you grateful for today?'),p('把这一周收好','Put this week away safely.')]},
      {id:'first-cup',zh:'今天的第一杯',en:'The first cup',type:'one_day',available:true,prompts:[p('今天的第一杯是什么？','What is your first cup today?'),p('它陪你到了哪里？','Where did it take you?'),p('此刻的心情','How do you feel right now?')]}
    ];
    const initialConfig={recommended:['slow-weekend','city-walk','friends-day'],aiEnabled:true,bannerZh:'今天也值得被好好记录。',bannerEn:'Today is worth keeping, too.'};
    const clone=x=>JSON.parse(JSON.stringify(x)); const iso=()=>new Date().toISOString();
    const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x),text40=x=>typeof x==='string'&&x.trim().length>0&&x.trim().length<=40;
    function validPrompt(x){return isObj(x)&&typeof x.id==='string'&&x.id&&typeof x.zh==='string'&&x.zh.trim().length>0&&x.zh.trim().length<=100&&typeof x.en==='string'&&x.en.trim().length>0&&x.en.trim().length<=100}
    function validTheme(t){if(!isObj(t)||typeof t.id!=='string'||!t.id||!text40(t.zh)||!text40(t.en)||typeof t.available!=='boolean'||!Array.isArray(t.prompts)||!t.prompts.every(validPrompt))return false;return t.type==='one_day'?t.prompts.length>=1&&t.prompts.length<=12:t.type==='seven_day'&&t.prompts.length===7}
    function validConfig(c,themes,requireAvailable=true){if(!Array.isArray(themes)||!isObj(c)||!Array.isArray(c.recommended)||c.recommended.length>6||new Set(c.recommended).size!==c.recommended.length||typeof c.aiEnabled!=='boolean'||typeof c.bannerZh!=='string'||!c.bannerZh.trim()||typeof c.bannerEn!=='string'||!c.bannerEn.trim())return false;return c.recommended.every(id=>typeof id==='string'&&themes.some(t=>isObj(t)&&t.id===id&&(!requireAvailable||t.available)))}
    function validRelease(r){return isObj(r)&&Number.isInteger(r.revision)&&r.revision>0&&typeof r.publishedAt==='string'&&isObj(r.snapshot)&&Array.isArray(r.snapshot.themes)&&r.snapshot.themes.every(validTheme)&&validConfig(r.snapshot.config,r.snapshot.themes)}
    function validReleases(rs){return Array.isArray(rs)&&rs.length>0&&rs.every(validRelease)&&new Set(rs.map(r=>r.revision)).size===rs.length}
    function baseline(){const themes=clone(initialThemes),config=clone(initialConfig),published=themes.filter(t=>t.id!=='first-cup');return {themes,config,releases:[{revision:1,publishedAt:'2026-09-18T09:10:00.000Z',note:'初始本地版本',snapshot:{themes:clone(published),config:clone(config)}}],draftBaseRevision:1,storageOK:true}}
    let state=load(); let configDraft=clone(state.config),configDirty=false,themeFormDirty=false,pendingPublish=null; let activePage='overview'; let range=7; let group='all'; let editingId=null; let themeQuery=''; let issueFilter='all';
    function load(){try{const raw=localStorage.getItem(STORAGE);if(!raw)return baseline();const data=JSON.parse(raw);if(!isObj(data)||!Array.isArray(data.themes)||!data.themes.every(validTheme)||!validConfig(data.config,data.themes,false)||!validReleases(data.releases)||!Number.isInteger(data.draftBaseRevision)||data.draftBaseRevision<1||!data.releases.some(r=>r.revision===data.draftBaseRevision))throw Error('不完整');return {themes:data.themes,config:data.config,releases:data.releases,draftBaseRevision:data.draftBaseRevision,storageOK:true}}catch(e){const s=baseline();s.storageOK=false;setTimeout(()=>storageProblem('本地已保存的数据无法安全读取，已回退到内置演示数据。'),0);return s}}
    function payload(candidate){return {themes:candidate.themes,config:candidate.config,releases:candidate.releases,draftBaseRevision:candidate.draftBaseRevision}}

    function goPage(id){if(id===activePage)return;if(configDirty&&!confirm('运营配置有未保存的输入。确定离开此页面吗？'))return;activePage=id;showPage(id);renderNav()}
    function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo({top:0,behavior:'smooth'})}
    function openTheme(id){editingId=id||null;const t=id?state.themes.find(x=>x.id===id):null;$('themeDialogTitle').textContent=t?'编辑主题':'新建主题';$('themeZh').value=t?.zh||'';$('themeEn').value=t?.en||'';$('themeType').value=t?.type||'one_day';$('themePromptsZh').value=t?.prompts.map(x=>x.zh).join('\n')||'';$('themePromptsEn').value=t?.prompts.map(x=>x.en).join('\n')||'';$('themeAvailable').checked=t?.available??true;themeFormDirty=false;$('themeError').classList.remove('show');$('themeDialog').showModal();$('themeZh').focus()}
    function previewTheme(id){const t=state.themes.find(x=>x.id===id);if(!t)return;$('previewContent').innerHTML=`<div class="preview-box"><span class="status ${t.available?'live':'paused'}">${t.type==='seven_day'?'七天故事':'一天故事'} · ${themeStatus(t)}</span><h4>${escapeHtml(t.zh)}</h4><p class="en">${escapeHtml(t.en)}</p><div class="preview-prompts">${t.prompts.map((x,i)=>`<div>${i+1}. ${escapeHtml(x.zh)}<span class="sub">${escapeHtml(x.en)}</span></div>`).join('')}</div></div>`;$('previewDialog').showModal()}
    function closeTheme(){if(!themeFormDirty||confirm('主题编辑尚未保存，确定放弃这些输入吗？')){$('themeDialog').close();themeFormDirty=false}}
    function themeFromForm(){const zhLines=$('themePromptsZh').value.split('\n').map(x=>x.trim()),enLines=$('themePromptsEn').value.split('\n').map(x=>x.trim());const current=editingId&&state.themes.find(x=>x.id===editingId);return {id:editingId||('custom-'+Date.now()),zh:$('themeZh').value.trim(),en:$('themeEn').value.trim(),type:$('themeType').value,available:$('themeAvailable').checked,prompts:Array.from({length:Math.max(zhLines.length,enLines.length)},(_,i)=>({id:current?.prompts[i]?.id||'prompt-'+Date.now()+'-'+i,zh:zhLines[i]||'',en:enLines[i]||''}))}}
    function showThemeError(message){const er=$('themeError');er.textContent=message;er.classList.add('show')}
    $('themeForm').addEventListener('submit',e=>{e.preventDefault();const draft=themeFromForm();if(!validTheme(draft)){showThemeError(draft.type==='seven_day'?'七天主题必须有恰好 7 条逐行对应的中英文提示；标题各不超过 40 字符。':'一天主题需有 1–12 条逐行对应的中英文提示；标题各不超过 40 字符。');return}const candidate={...state,themes:editingId?state.themes.map(t=>t.id===editingId?draft:t):[...state.themes,draft]};if(!persistCandidate(candidate)){showThemeError('保存失败：浏览器未写入本地草稿。请保留输入后重试。');return}state={...candidate,storageOK:true};themeFormDirty=false;$('themeDialog').close();renderThemes();renderConfig();toast('主题草稿已保存；发布后才会生成新的本地版本。')});
    function validForPublish(candidate){if(!candidate.themes.length||!candidate.themes.every(validTheme)){toast('所有主题必须具备有效双语标题、提示数量和逐行对应内容。');return false}if(!validConfig(candidate.config,candidate.themes,true)){toast('推荐主题必须唯一、最多 6 个，并且全部处于可用状态；双语横幅不能为空。');return false}return true}
    function saveConfigDraft(){syncConfigInputs();const candidate={...state,config:clone(configDraft)};if(!validConfig(candidate.config,candidate.themes,false)){toast('草稿配置格式无效。请检查推荐主题与双语横幅。');return}if(!persistCandidate(candidate))return;state={...candidate,storageOK:true};configDraft=clone(state.config);configDirty=false;renderConfig();toast('运营配置草稿已保存。')}
    function publishDiff(){const active=activeSnapshot(),draft={themes:state.themes,config:configDraft};const changed=draft.themes.filter(t=>{const old=active.themes.find(x=>x.id===t.id);return !old||JSON.stringify(old)!==JSON.stringify(t)});const removed=active.themes.filter(t=>!draft.themes.some(x=>x.id===t.id));const names=[...changed.map(t=>t.zh),...removed.map(t=>t.zh+'（移出）')];const namesFor=ids=>ids.map(id=>draft.themes.find(t=>t.id===id)?.zh||id).join('、')||'无';const activeRec=active.config.recommended.map(id=>active.themes.find(t=>t.id===id)?.zh||id).join('、')||'无';return {active,draft,changed,names,activeRec,currentRec:namesFor(draft.config.recommended),stale:state.draftBaseRevision!==activeRevision(),ai:active.config.aiEnabled!==draft.config.aiEnabled,banner:active.config.bannerZh!==draft.config.bannerZh||active.config.bannerEn!==draft.config.bannerEn}}
    function publishLocal(){syncConfigInputs();const candidate={...state,config:clone(configDraft),themes:clone(state.themes)};if(!validForPublish(candidate))return;const diff=publishDiff();pendingPublish=candidate;$('publishReview').innerHTML=`<div class="mini-list"><div class="mini-row"><div><strong>草稿基线</strong><span>草稿基于 v${state.draftBaseRevision}；当前发布版本为 v${activeRevision()}。</span></div></div>${diff.stale?'<div class="notice">当前草稿基于较早版本。确认发布会用当前草稿创建新版本，历史恢复的发布快照不会自动合并。</div>':''}<div class="mini-row"><div><strong>主题</strong><span>${diff.names.length?`变更 ${diff.names.length} 个：${escapeHtml(diff.names.join('、'))}`:'无内容变更'}</span></div></div><div class="mini-row"><div><strong>推荐主题</strong><span>v${activeRevision()}：${escapeHtml(diff.activeRec)}<br/>草稿：${escapeHtml(diff.currentRec)}</span></div></div><div class="mini-row"><div><strong>AI 提示建议</strong><span>${diff.ai?`将从“${diff.active.config.aiEnabled?'开启':'关闭'}”改为“${diff.draft.config.aiEnabled?'开启':'关闭'}”。`:'保持不变。'}</span></div></div><div class="mini-row"><div><strong>双语横幅</strong><span>${diff.banner?'横幅文案有变更。':'横幅文案保持不变。'}</span></div></div></div>`;$('publishDialog').showModal()}
    function confirmPublish(){if(!pendingPublish)return;const next=activeRevision()+1;const candidate={...pendingPublish,releases:[...state.releases,{revision:next,publishedAt:iso(),note:'从当前草稿发布',snapshot:{themes:clone(pendingPublish.themes),config:clone(pendingPublish.config)}}],draftBaseRevision:next};if(!validForPublish(candidate))return;if(!persistCandidate(candidate))return;state={...candidate,storageOK:true};configDraft=clone(state.config);configDirty=false;pendingPublish=null;$('publishDialog').close();renderThemes();renderConfig();updateSaveState();renderReleases();toast(`已发布本地版本 v${next}，快照不可变。`)}
    function cancelPublish(){pendingPublish=null;$('publishDialog').close()}
    function showSnapshot(rev){const r=state.releases.find(x=>x.revision===rev);if(!r)return;$('snapshotTitle').textContent=`v${r.revision} 的发布快照`;$('snapshotContent').textContent=JSON.stringify(r.snapshot,null,2);$('snapshotDialog').showModal()}
    function restoreRelease(rev){const source=state.releases.find(r=>r.revision===rev);if(!source||!validRelease(source)){toast('该历史快照无法通过发布校验。');return}const next=activeRevision()+1,restored=clone(source.snapshot);const candidate={...state,releases:[...state.releases,{revision:next,publishedAt:iso(),note:`恢复发布快照 v${rev}`,snapshot:restored}]};if(!validRelease(candidate.releases.at(-1)))return;if(!persistCandidate(candidate))return;state={...candidate,storageOK:true};renderThemes();renderConfig();updateSaveState();renderReleases();toast(`已恢复发布快照为本地 v${next}；当前草稿保留。`)}
    function showIssue(i){$('issueContent').innerHTML=`<div class="detail-grid"><div><span>事件</span><strong>${i.id}</strong></div><div><span>样本</span><strong>${i.sample}</strong></div><div><span>阈值</span><strong>${i.threshold}</strong></div></div><div class="notice">${i.note}</div>`;$('issueDialog').showModal()}
    ['themeZh','themeEn','themeType','themePromptsZh','themePromptsEn','themeAvailable'].forEach(id=>$(id).addEventListener('input',()=>{themeFormDirty=true}));$('closeTheme').onclick=closeTheme;$('cancelTheme').onclick=closeTheme;$('themeDialog').addEventListener('cancel',e=>{if(themeFormDirty&&!confirm('主题编辑尚未保存，确定放弃这些输入吗？'))e.preventDefault();else themeFormDirty=false});$('confirmPublish').onclick=confirmPublish;$('cancelPublish').onclick=cancelPublish;$('cancelPublishTop').onclick=cancelPublish;$('publishDialog').addEventListener('cancel',cancelPublish);window.addEventListener('beforeunload',e=>{if(configDirty||themeFormDirty){e.preventDefault();e.returnValue=''}});renderAll();
  })();
  </script>

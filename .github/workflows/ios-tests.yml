name: iOS Tests

# PR/push waits on the cheap lanes: layer check, workers/api, unit tests, and
# four core UI suites. The expensive remainder — shared-room integration
# (ROOM_SUITES, including the video-rendering tests that dominate runner
# time) and the other UI suites — runs weekly and on manual dispatch.
#
# Why the split exists: a single `xcodebuild test` was 65 minutes on the
# runner (run 35519844647), and twelve video-rendering tests accounted for
# 46 of those. The runner has no GPU, so the stitcher's per-clip look pass
# is software Core Image, 10–20x slower than a laptop. Those twelve tests
# already live in ROOM_SUITES; moving that lane off push is what takes them
# off the PR path.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'workers/api/**'
      - 'workers/suggest-prompts/**'
      - '.github/workflows/ios-tests.yml'
      - '.github/actions/**'
  pull_request:
    paths:
      - 'ios/**'
      - 'workers/api/**'
      - 'workers/suggest-prompts/**'
      - '.github/workflows/ios-tests.yml'
      - '.github/actions/**'
  # Sunday 08:00 Asia/Singapore (00:00 UTC).
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  # Shared-room integration tests. They drive the real ChallengeStore,
  # RoomSyncService and VideoStitcher through the local-room harness, so they
  # are testing the shipping two- and three-person room, not the demo
  # scaffolding that stands in for CloudKit. They also include the
  # video-rendering tests that are 10–20x slower on the GPU-less runner,
  # which is why this list waits for the weekly/manual lane.
  #
  # Defined once and used twice — `-only-testing` for the room lane and
  # `-skip-testing` for `unit` — so the lanes always partition the suite
  # and a new file cannot quietly land in both or neither. A new UI suite
  # must be added to CORE_UI_SUITES, EXTENDED_UI_SUITES, or ROOM_SUITES.
  ROOM_SUITES: >-
    AISetlogTests/LocalRoomRuntimeTests
    AISetlogTests/LocalRoomRuntimeBoundaryTests
    AISetlogTests/LocalRoomImportTests
    AISetlogTests/LocalRoomImportConcurrencyTests
    AISetlogTests/LocalFormalMediaLifecycleTests
    AISetlogTests/RoomPreviewMediaScopeTests
    AISetlogTests/LocalRoomDemoOwnerTests
    AISetlogTests/RoomVideoDemoTests
    AISetlogTests/RoomVideoDemoFrameTests
    AISetlogTests/DefaultFilmAspectTests/testDemoAutoUpdatesAfterFirstMemberReplacementAndAllowsOverride
    AISetlogUITests/LocalFormalRoomUITests
    AISetlogUITests/LocalFormalMomentUITests
    AISetlogUITests/LocalRoomImportUITests

  # Core UI suites on every PR/push: capture and review, room navigation,
  # avatar setup, mood and plan.
  CORE_UI_SUITES: >-
    AISetlogUITests/CaptureReviewUITests
    AISetlogUITests/RoomNavigationUITests
    AISetlogUITests/AvatarFlowUITests
    AISetlogUITests/MoodTodayUITests

  # The remaining UI suites. Not deleted; run on the weekly/manual lane.
  EXTENDED_UI_SUITES: >-
    AISetlogUITests/ComposerGuidanceUITests
    AISetlogUITests/CreationFlowUITests
    AISetlogUITests/IntentFirstCreationUITests
    AISetlogUITests/RoomFramesUITests
    AISetlogUITests/RoomPreviewCardUITests
    AISetlogUITests/SevenDayVisibilityUITests

  # Skipped in every lane. These four talk to the real CloudKit development
  # database. They already skip on a simulator that isn't signed into iCloud —
  # but here they can't even ask: unsigned means no iCloud entitlement, and
  # `accountStatus()` on an unentitled container kills the test host rather
  # than returning an error, so there's nothing left alive to skip from.
  # Run them on a machine with an iCloud-signed simulator instead.
  ALWAYS_SKIP: >-
    AISetlogTests/CloudKitIdempotencyTests
    AISetlogTests/CloudKitPaginationTests
    AISetlogTests/RoomSyncIntegrationTests
    AISetlogTests/JoinedRoomTests

jobs:
  # Cheap and first to fail: no simulator, no build.
  layers:
    name: Layer boundaries
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Models must stay UI-agnostic: no localized display strings in there
      # (presentation text belongs to ChallengePresenter / the view layer).
      - name: Verify layer boundaries
        run: |
          if grep -rn "Strings\." ios/AISetlog/Models/; then
            echo "::error::Models layer references Strings — move display text to ChallengePresenter"
            exit 1
          fi

  # package.json script is `node --test test/*.test.mjs`. The tests use
  # `node:sqlite` (no npm dependencies), which is stable on Node 24.
  api:
    name: API tests (${{ matrix.worker }})
    strategy:
      matrix:
        worker: [api, suggest-prompts]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test

  unit:
    name: Unit tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
        id: setup
        with:
          lane: unit
      - name: Run tests
        working-directory: ios
        run: |
          flags=""
          for suite in $ROOM_SUITES $ALWAYS_SKIP; do
            flags="$flags -skip-testing:$suite"
          done
          xcodebuild test \
            -scheme AISetlog \
            -destination "id=${{ steps.setup.outputs.simulator-id }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:AISetlogTests \
            $flags \
            CODE_SIGNING_ALLOWED=NO

  ui:
    name: UI tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
        id: setup
        with:
          lane: ui
      - name: Run tests
        working-directory: ios
        run: |
          flags=""
          for suite in $CORE_UI_SUITES; do
            flags="$flags -only-testing:$suite"
          done
          xcodebuild test \
            -scheme AISetlog \
            -destination "id=${{ steps.setup.outputs.simulator-id }}" \
            -derivedDataPath build/DerivedData \
            $flags \
            CODE_SIGNING_ALLOWED=NO

  # Shared-room integration, including the video-rendering tests in
  # ROOM_SUITES. Weekly and manual only — not on push or pull_request.
  room:
    name: Shared-room integration
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
        id: setup
        with:
          lane: room
      - name: Run tests
        working-directory: ios
        run: |
          flags=""
          for suite in $ROOM_SUITES; do
            flags="$flags -only-testing:$suite"
          done
          # `LocalFormalRoomUITests/testFormalRoomFilmRenders` renders a real
          # three-member film through the production FilmView. UITestWait
          # records the measurements: the compositor alone costs 141.5s here
          # with no UI on top of it. It does not fit under the 240s ceiling,
          # and raising the ceiling would only move the number the test is
          # really measuring, which is the runner. The film path itself is
          # covered by VideoStitcherTests, SharedRoomFilmTests and
          # DefaultFilmAspectTests; what only the UI test can see is that
          # 「看成片」 reaches a rendered film through the real navigation
          # stack, and that is verified on a Mac.
          xcodebuild test \
            -scheme AISetlog \
            -destination "id=${{ steps.setup.outputs.simulator-id }}" \
            -derivedDataPath build/DerivedData \
            $flags \
            -skip-testing:AISetlogUITests/LocalFormalRoomUITests/testFormalRoomFilmRenders \
            -skip-testing:AISetlogUITests/LocalFormalRoomUITests/testFormalRoomFilmFilterAndHold \
            CODE_SIGNING_ALLOWED=NO

  # UI suites that are not in CORE_UI_SUITES or ROOM_SUITES.
  extended-ui:
    name: Extended UI tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ios
        id: setup
        with:
          lane: extended-ui
      - name: Run tests
        working-directory: ios
        run: |
          flags=""
          for suite in $EXTENDED_UI_SUITES; do
            flags="$flags -only-testing:$suite"
          done
          xcodebuild test \
            -scheme AISetlog \
            -destination "id=${{ steps.setup.outputs.simulator-id }}" \
            -derivedDataPath build/DerivedData \
            $flags \
            CODE_SIGNING_ALLOWED=NO

name: iOS Tests

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-tests.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-tests.yml']

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Has to be an Xcode whose iOS SDK matches a simulator runtime the runner
      # image still ships. 16.2 stopped qualifying: the image kept the app but
      # dropped the iOS 18.2 runtime, and `actool` fails the whole build rather
      # than thin the asset catalog against a runtime it doesn't have an SDK
      # for. 16.4 is the image default, so its SDK and runtime move together.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Verify layer boundaries
        # Models must stay UI-agnostic: no localized display strings in there
        # (presentation text belongs to ChallengePresenter / the view layer).
        run: |
          if grep -rn "Strings\." AISetlog/Models/; then
            echo "::error::Models layer references Strings — move display text to ChallengePresenter"
            exit 1
          fi

      # Naming a simulator only works while the image happens to have created
      # one. It doesn't: under this Xcode the runner lists no concrete iOS
      # devices at all, just placeholders. So make our own, on the runtime that
      # matches the SDK exactly — `actool` rejects even a newer runtime of the
      # same iOS major, which is what took CI down. The phone model is
      # irrelevant to unit tests; the runtime agreeing with the SDK is not.
      - name: Create a simulator the SDK agrees with
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtimes=$(xcrun simctl list runtimes -j)
          runtime=$(jq -r --arg sdk "$sdk" \
            '[.runtimes[] | select(.isAvailable and .platform == "iOS")]
             | (map(select(.version == $sdk)) + (sort_by(.version) | reverse))
             | .[0].identifier // ""' <<<"$runtimes")
          if [ -z "$runtime" ]; then
            echo "::error::no usable iOS simulator runtime for SDK $sdk"
            exit 1
          fi
          device=$(jq -r --arg r "$runtime" \
            '.runtimes[] | select(.identifier == $r)
             | [.supportedDeviceTypes[] | select(.productFamily == "iPhone")]
             | .[0].identifier' <<<"$runtimes")
          echo "SDK $sdk -> $runtime -> $device"
          xcrun simctl create ci-iphone "$device" "$runtime"

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme AISetlog \
            -destination 'platform=iOS Simulator,name=ci-iphone' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

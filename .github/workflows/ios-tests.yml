name: iOS Tests

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-tests.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-tests.yml']

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # Has to be an Xcode whose iOS SDK matches a simulator the runner image
      # still ships. 16.2 stopped qualifying: the image kept the app but dropped
      # the iOS 18.2 runtime, and `actool` fails the whole build rather than
      # thin an asset catalog against a runtime it has no SDK for — it won't
      # take even a newer runtime of the same iOS major. Every simulator on the
      # image runs iOS 26 now, so the Xcode has to be a 26 as well.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Verify layer boundaries
        # Models must stay UI-agnostic: no localized display strings in there
        # (presentation text belongs to ChallengePresenter / the view layer).
        run: |
          if grep -rn "Strings\." AISetlog/Models/; then
            echo "::error::Models layer references Strings — move display text to ChallengePresenter"
            exit 1
          fi

      # Ask xcodebuild which simulator it can run on, instead of naming a phone
      # and hoping the image still has one — it stopped having `iPhone 16`, and
      # a simulator created behind xcodebuild's back never appears in this list
      # at all. Whichever iPhone comes back first is fine: these are unit tests,
      # they don't care about the screen.
      - name: Pick a simulator
        run: |
          simulator=$(xcodebuild -showdestinations -scheme AISetlog 2>/dev/null \
            | grep 'platform:iOS Simulator' | grep -v placeholder \
            | sed -n 's/.*id:\([0-9A-Fa-f-]*\).*/\1/p' | head -1)
          if [ -z "$simulator" ]; then
            echo "::error::this Xcode can't use any simulator on the runner"
            xcodebuild -showdestinations -scheme AISetlog || true
            exit 1
          fi
          echo "SIMULATOR_ID=$simulator" >> "$GITHUB_ENV"
          echo "testing on $simulator"

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme AISetlog \
            -destination "id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

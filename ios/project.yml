name: AISetlog
options:
  bundleIdPrefix: com.cassie
  deploymentTarget:
    iOS: "17.0"
  developmentRegion: en
  knownRegions: [en, "zh-Hans", Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
targets:
  AISetlog:
    type: application
    platform: iOS
    sources: [AISetlog, CaptureShared]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AISetlog/AISetlog.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "37"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconBlue
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "ImagePlayground"]
      configs:
        Debug:
          APS_ENVIRONMENT: development
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.dev
          APP_DISPLAY_NAME: 1Day Dev
          GOOGLE_CLIENT_ID: 513162743274-s9mjujjgqf588097792ctueka46gfkhc.apps.googleusercontent.com
          GOOGLE_URL_SCHEME: com.googleusercontent.apps.513162743274-s9mjujjgqf588097792ctueka46gfkhc
        Release:
          APS_ENVIRONMENT: production
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog
          APP_DISPLAY_NAME: 1Day
          GOOGLE_CLIENT_ID: 513162743274-5p1dgi8km91pchmbh9q2l6piiesuouug.apps.googleusercontent.com
          GOOGLE_URL_SCHEME: com.googleusercontent.apps.513162743274-5p1dgi8km91pchmbh9q2l6piiesuouug
    entitlements:
      path: AISetlog/AISetlog.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.background-tasks.continued-processing.gpu: true
    info:
      path: AISetlog/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        OneDayAPNsEnvironment: $(APS_ENVIRONMENT)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "To film the moments of your day."
        NSMicrophoneUsageDescription: "So your clips have sound."
        NSSpeechRecognitionUsageDescription: "用来把你说的话转成心情日记里的文字。"
        NSPhotoLibraryAddUsageDescription: "To save your finished film to Photos."
        NSRemindersFullAccessUsageDescription: "To copy your reminders into today's list."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        BGTaskSchedulerPermittedIdentifiers: ["$(PRODUCT_BUNDLE_IDENTIFIER).film-export.*"]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.cassie.oneday.join
            CFBundleURLSchemes: [oneday]
          - CFBundleURLName: com.cassie.oneday.google-sign-in
            CFBundleURLSchemes: [$(GOOGLE_URL_SCHEME)]
        GIDClientID: $(GOOGLE_CLIENT_ID)
    dependencies:
      - target: OneDayLockedCapture
        embed: true
      - target: OneDayCaptureControls
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
  OneDayLockedCapture:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [LockedCapture, CaptureShared]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "37"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.dev.capture
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.capture
    info:
      path: LockedCapture/Info.plist
      properties:
        CFBundleDisplayName: 1Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "To film the moments of your day."
        NSMicrophoneUsageDescription: "So your clips have sound."
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.securecapture
  OneDayCaptureControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [CaptureControls, CaptureShared]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.6"
        CURRENT_PROJECT_VERSION: "37"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.dev.controls
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.controls
    info:
      path: CaptureControls/Info.plist
      properties:
        CFBundleDisplayName: 1Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

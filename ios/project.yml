name: AISetlog
options:
  bundleIdPrefix: com.cassie
  deploymentTarget:
    iOS: "17.0"
  developmentRegion: en
  knownRegions: [en, "zh-Hans", Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  AISetlog:
    type: application
    platform: iOS
    sources: [AISetlog]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AISetlog/AISetlog.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "30"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconBlue
      configs:
        # Debug installs beside the App Store build as "1Day Dev" and reads the
        # same Production CloudKit database, so rooms made in either app open in
        # both. Switch Debug's CLOUDKIT_ENVIRONMENT to Development while changing
        # the CloudKit schema — Production rejects fields it hasn't been deployed.
        Debug:
          APS_ENVIRONMENT: development
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog.dev
          APP_DISPLAY_NAME: 1Day Dev
          CLOUDKIT_ENVIRONMENT: Production
        Release:
          APS_ENVIRONMENT: production
          PRODUCT_BUNDLE_IDENTIFIER: com.cassie.AISetlog
          APP_DISPLAY_NAME: 1Day
          CLOUDKIT_ENVIRONMENT: Production
    entitlements:
      path: AISetlog/AISetlog.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cassie.AISetlog
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT)
    info:
      path: AISetlog/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        OneDayCloudKitEnvironment: $(CLOUDKIT_ENVIRONMENT)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "To film the moments of your day."
        NSMicrophoneUsageDescription: "So your clips have sound."
        NSSpeechRecognitionUsageDescription: "用来把你说的话转成心情日记里的文字。"
        NSPhotoLibraryAddUsageDescription: "To save your finished film to Photos."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.cassie.oneday.join
            CFBundleURLSchemes: [oneday]
  AISetlogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AISetlogTests]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AISetlog
  AISetlogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AISetlogUITests]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AISetlog

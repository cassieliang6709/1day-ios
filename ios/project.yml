name: AISetlog
options:
  bundleIdPrefix: com.cassie
  deploymentTarget:
    iOS: "17.0"
  developmentRegion: en
  knownRegions: [en, "zh-Hans", Base]
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  AISetlog:
    type: application
    platform: iOS
    sources: [AISetlog]
    settings:
      base:
        DEVELOPMENT_TEAM: M7BPQ88622
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AISetlog/AISetlog.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "4"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    entitlements:
      path: AISetlog/AISetlog.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin: [Default]
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.cassie.AISetlog
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: AISetlog/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 1Day
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: "Record your 2-second daily challenge clip."
        NSMicrophoneUsageDescription: "Capture audio for your daily clip."
        NSPhotoLibraryAddUsageDescription: "Save your finished weekly vlog."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.cassie.oneday.join
            CFBundleURLSchemes: [oneday]
  AISetlogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AISetlogTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AISetlog

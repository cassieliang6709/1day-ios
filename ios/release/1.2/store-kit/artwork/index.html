<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1Day — Store artwork</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,'PingFang SC',-apple-system,BlinkMacSystemFont,sans-serif;color:#102343;background:#eaf3ff}.canvas{width:1320px;height:2868px;overflow:hidden;position:relative;padding:90px 90px 0;background:#eaf3ff}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:72px}.brand{width:240px}.tag{font-size:27px;letter-spacing:.13em;text-transform:uppercase;color:#376195;font-weight:700}.headline{font-size:112px;line-height:1.09;font-weight:800;letter-spacing:-.055em;margin:0;position:relative;z-index:1}.headline span{color:#1677ff}.sub{font-size:34px;line-height:1.5;color:#486586;margin:32px 0 0;max-width:1050px}.device{position:absolute;width:922px;left:199px;top:780px;z-index:2;background:#142642;padding:12px;border-radius:112px;box-shadow:0 45px 100px #1c55952e;border:3px solid #54739a}.screen{display:block;width:100%;height:auto;border-radius:97px}.foot{position:absolute;bottom:32px;left:0;width:100%;text-align:center;font-size:23px;color:#557091;letter-spacing:.03em}.photo{position:absolute;z-index:1;width:300px;height:510px;object-fit:cover;border-radius:52px;box-shadow:0 30px 80px #1c559533;border:8px solid #fff}.photo.left{left:24px;top:1160px;transform:rotate(-5deg)}.photo.right{right:24px;top:1710px;transform:rotate(5deg)}.count{font-size:30px;letter-spacing:.08em;position:absolute;right:94px;top:664px;color:#5c79a1}.orbit{position:absolute;width:1500px;height:1500px;border:2px solid #c1d8f6;border-radius:50%;top:1200px;left:-90px}.canvas.dark{background:#102f62;color:#fff}.dark .headline span{color:#88c1ff}.dark .sub,.dark .tag,.dark .foot,.dark .count{color:#c1d9fa}.dark .orbit{border-color:#315280}.dark .brand{filter:brightness(0) invert(1)}.dark .photo{border-color:#315280}.og .photo{display:none}.canvas.zh .headline{font-size:108px;letter-spacing:-.035em;line-height:1.2}.canvas.og{width:1200px;height:630px;padding:60px}.og .top{margin:0 0 48px}.og .brand{width:190px}.og .tag{font-size:18px}.og .headline{font-size:67px;max-width:720px}.og.zh .headline{font-size:64px}.og .sub{font-size:23px;max-width:680px;margin-top:20px}.og .device{width:238px;left:auto;right:50px;top:75px;border-radius:31px;padding:4px}.og .screen{border-radius:25px}.og .foot,.og .count,.og .orbit{display:none}.og .tag{padding-right:270px}
</style></head><body><main class="canvas" id="art"><div class="orbit"></div><div class="top"><img class="brand" src="./brand.png"><span class="tag" id="tag"></span></div><h1 class="headline" id="headline"></h1><p class="sub" id="sub"></p><div class="count" id="count"></div><img class="photo left" id="photo-left" alt=""><img class="photo right" id="photo-right" alt=""><div class="device"><img class="screen" id="screen"></div><p class="foot" id="foot"></p></main>
<script>
const q=new URLSearchParams(location.search),lang=q.get('lang')==='zh'?'zh':'en',i=Number(q.get('slide')||1),og=q.has('og');
const text={en:[
['Pick a theme.<br><span>Start today’s Vlog.</span>','Perfect Day, Soft Reset, or Little Adventure — choose one and start filming.','composer',['4','7']],
['Follow the prompts.<br><span>Film a few seconds.</span>','Record 2, 5, or 10-second moments, one at a time.','timeline',['1','2']],
['Your daily Vlog.<br><span>Ready automatically.</span>','1Day brings your clips, captions, and transitions together on your iPhone.','film',['3','5']],
['No script?<br><span>Record as life happens.</span>','Choose Record by time and capture whatever happens next.','free',['4','6']],
['A little Blue company.<br><span>Your clips stay yours.</span>','Keep a video diary on your iPhone. No account needed to start.','home',['1','7']]
],zh:[
['选个主题，<br><span>开始今天的 Vlog。</span>','完美的一天、慢慢重启或小小冒险——选一个，就能开始拍。','composer',['4','7']],
['跟着提示，<br><span>每次拍几秒。</span>','选择 2 秒、5 秒或 10 秒，一个瞬间一个瞬间地记录。','timeline',['1','2']],
['今天的 Vlog，<br><span>自动准备好了。</span>','1Day 在 iPhone 上组合片段、字幕与转场。','film',['3','5']],
['不想写脚本？<br><span>生活发生，就拍下来。</span>','选择按时间拍，记录接下来真实发生的事。','free',['4','6']],
['有小蓝作伴，<br><span>记录仍属于你。</span>','单人片段保存在 iPhone，本机成片，无需账号即可开始。','home',['1','7']]
]};
const row=text[lang][i-1];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#art').className='canvas '+lang+(i===5?' dark':'')+(og?' og':'');document.querySelector('#headline').innerHTML=row[0];document.querySelector('#sub').textContent=row[1];document.querySelector('#tag').textContent=lang==='zh'?'视频日记 · iPhone':'VIDEO DIARY · iPHONE';document.querySelector('#count').textContent='0'+i+' / 05';document.querySelector('#screen').src='../raw/'+lang+'-'+row[2]+'.png';document.querySelector('#photo-left').src='./moments/moment-'+row[3][0]+'.jpg';document.querySelector('#photo-right').src='./moments/moment-'+row[3][1]+'.jpg';document.querySelector('#foot').textContent=lang==='zh'?'实际 App 界面 · 示例故事':'Actual app interface · Sample story';
</script></body></html>
